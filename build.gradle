
plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.16.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group 'br.com.gitflowhelper'
version '2.1.0'
    
intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '242'
            untilBuild = null
        }
    }
    pluginVerification {
        ides {
            recommended()
        }
    }
}

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2024.2.4')
        bundledPlugin('Git4Idea')
        bundledPlugin('com.intellij.tasks')
    }
}

tasks {
    buildSearchableOptions {
        enabled = false
    }
}